<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lesson 1.3 video</title>
<style>
    html, body { margin: 0; padding: 0; background: #0b1726; overflow: hidden; }
    svg { display: block; }
    .mono { font-family: "DejaVu Sans Mono", monospace; }
    .sans { font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="kit.js"></script>
<script>
header("1.3", "Expiration", "Every cached copy gets a deadline", ["TTL", "SLIDING"]);
if (!vertical) D.setAttribute("transform", "translate(1010,140) scale(0.76)");

function timerCard(x, title, rule) {
    const g = el("g", { opacity: 0 }, D);
    el("rect", { x: x - 145, y: 60, width: 290, height: 400, rx: 22, fill: "#0e1d2f", stroke: "#2c4258", "stroke-width": 2 }, g);
    txt(g, x, 110, title, { fill: C.cyan, "font-size": 28, "letter-spacing": 2 });
    txt(g, x, 145, rule, { fill: C.muted, "font-size": 20 });
    el("circle", { cx: x, cy: 270, r: 70, fill: "none", stroke: "#1b3047", "stroke-width": 14 }, g);
    const arc = el("circle", { cx: x, cy: 270, r: 70, fill: "none", stroke: C.cyan, "stroke-width": 14, "stroke-linecap": "round", transform: `rotate(-90 ${x} 270)` }, g);
    const pulse = el("circle", { cx: x, cy: 270, r: 70, fill: "none", stroke: C.cyan, "stroke-width": 4, opacity: 0 }, g);
    const value = txt(g, x, 282, "", { fill: C.text, "font-size": 34, "font-weight": 700 });
    const status = txt(g, x, 395, "", { fill: C.green, "font-size": 21, "font-weight": 700 });
    const bar = el("rect", { x: x - 110, y: 420, width: 0, height: 10, rx: 5, fill: C.orange, opacity: 0 }, g);
    return { g, arc, pulse, value, status, bar };
}
function setRing(c, left, color) {
    const len = 2 * Math.PI * 70;
    c.arc.setAttribute("stroke-dasharray", `${len * clamp(left)} ${len}`);
    c.arc.setAttribute("stroke", color);
}
function readPulse(c, t, reads) {
    const last = reads.filter(r => r <= t).pop();
    const p = last === undefined ? 1 : seg(t, last, last + 0.5);
    c.pulse.setAttribute("r", 70 + p * 30);
    c.pulse.setAttribute("opacity", last === undefined ? 0 : 1 - p);
    return last;
}

const absolute = timerCard(170, "ABSOLUTE", "dies at a fixed time");
const sliding = timerCard(500, "SLIDING", "each read adds time");
const both = timerCard(830, "BOTH", "sliding + max age");

const dns = el("g", { opacity: 0 }, D);
const phone = el("g", {}, dns);
cube(phone, 140, 720, 70);
txt(phone, 140, 830, "your phone", { fill: C.cyan, "font-size": 26 });
const resolver = el("g", {}, dns);
cylinder(resolver, 480, 620, 90, 30, 120, C.cyan, 3);
txt(resolver, 480, 575, "DNS cache", { fill: C.cyan, "font-size": 28 });
txt(resolver, 480, 800, "facebook.com → 157.240.x.x", { fill: C.text, "font-size": 22 });
el("circle", { cx: 620, cy: 650, r: 34, fill: "none", stroke: "#1b3047", "stroke-width": 9 }, resolver);
const ttlArc = el("circle", { cx: 620, cy: 650, r: 34, fill: "none", stroke: C.cyan, "stroke-width": 9, "stroke-linecap": "round", transform: "rotate(-90 620 650)" }, resolver);
txt(resolver, 620, 710, "TTL", { fill: C.muted, "font-size": 20 });
const fbServer = el("g", { opacity: 0 }, dns);
cube(fbServer, 860, 700, 75, C.orange);
const fbLabel = txt(fbServer, 860, 820, "Facebook DNS", { fill: C.orange, "font-size": 26 });
const fbX = txt(fbServer, 860, 720, "✕", { fill: C.red, "font-size": 120, "font-weight": 800, filter: "url(#glow)", opacity: 0 });
const phoneLink = link(dns, "M 200 690 L 395 660", C.cyan);
const fbLink = link(dns, "M 570 690 L 790 700", C.orange);
const apps = ["Facebook", "Instagram", "WhatsApp"].map((name, i) => {
    const g = el("g", {}, dns);
    const x = 200 + i * 300;
    const r = el("rect", { x: x - 120, y: 870, width: 240, height: 56, rx: 28, fill: "#0f3a40", stroke: C.cyan, "stroke-width": 2 }, g);
    const label = txt(g, x, 908, name, { class: "sans", "font-size": 28, "font-weight": 700, fill: C.cyan });
    return { r, label };
});
const outage = txt(D, 500, 990, "offline for about 6 hours", { fill: C.red, "font-size": 34, "font-weight": 700, filter: "url(#glow)", opacity: 0 });
const cta = txt(D, 500, 990, "TRY THE 3 COUNTDOWN CARDS", { fill: C.cyan, "font-size": 30, "letter-spacing": 2, opacity: 0 });

captions = [
    [0, 5.5, "A cached copy should not live forever. Expiration gives it a deadline."],
    [5.5, 11.3, "Absolute: the copy dies at a fixed time, no matter how often you read it."],
    [11.3, 16.8, "Sliding: every read gives it more time, so popular data stays."],
    [16.8, 21.4, "The best choice is usually both: sliding, with a maximum age."],
    [21.4, 28.6, "Every website address your phone looks up is cached with a timer: a TTL."],
    [28.6, 37.4, "2021: Facebook's address servers became unreachable. Cached answers kept people connected for a while."],
    [37.4, 43.4, "Then the timers ran out. Facebook, Instagram and WhatsApp disappeared for six hours."],
    [43.4, 46.0, "Try the three countdown cards in the demo."]
];
endCard("Expiration", "Lesson 1.3 · try the countdown cards", 45.6);

const slidingReads = [12.0, 13.4, 14.8, 16.2, 17.6, 19.0, 20.4];
const bothReads = [17.6, 18.8, 20.0];

play(t => {
    const top = t < 21.2 ? 1 : 0.3 + 0.7 * (1 - seg(t, 21.2, 21.8));
    [absolute, sliding, both].forEach((c, i) => show(c.g, seg(t, [5.0, 11.0, 16.6][i], [5.0, 11.0, 16.6][i] + 0.6) * top));

    readPulse(absolute, t, [7.0, 8.9]);
    const aLeft = 1 - seg(t, 5.6, 10.6);
    setRing(absolute, aLeft, aLeft > 0 ? C.cyan : C.red);
    absolute.value.textContent = aLeft > 0 ? `${Math.ceil(aLeft * 20)} s` : "0 s";
    absolute.status.textContent = aLeft > 0 ? (t > 7 && t < 9.6 ? "read · no extra time" : "ALIVE") : "EXPIRED";
    absolute.status.setAttribute("fill", aLeft > 0 ? C.green : C.red);

    const sLast = readPulse(sliding, t, slidingReads) ?? 11.4;
    const sLeft = 1 - (t - sLast) / 3.2;
    setRing(sliding, sLeft, C.cyan);
    sliding.value.textContent = `${Math.max(0, Math.ceil(sLeft * 8))} s`;
    sliding.status.textContent = t - sLast < 0.8 && t > 12 ? "read · reset to 8 s" : "ALIVE";

    const bLast = readPulse(both, t, bothReads) ?? 16.9;
    const age = seg(t, 16.9, 20.6);
    const bLeft = age < 1 ? 1 - (t - bLast) / 3.2 : 0;
    setRing(both, bLeft, age < 1 ? C.cyan : C.red);
    both.value.textContent = age < 1 ? `${Math.max(0, Math.ceil(bLeft * 8))} s` : "0 s";
    both.status.textContent = age < 1 ? "ALIVE" : "EXPIRED · max age";
    both.status.setAttribute("fill", age < 1 ? C.green : C.red);
    both.bar.setAttribute("width", 220 * age);
    show(both.bar, t > 16.9 ? 1 : 0);

    show(dns, seg(t, 21.4, 22.2));
    show(fbServer, seg(t, 24.2, 24.9));
    [phoneLink, fbLink].forEach(l => l.setAttribute("stroke-dashoffset", -t * 30));
    show(phoneLink, seg(t, 22.0, 22.6) * 0.9);
    show(fbLink, seg(t, 24.4, 25.0) * (t > 28.6 ? 0.25 : 0.9));
    show(fbX, seg(t, 28.8, 29.3));
    fbLabel.textContent = t > 28.8 ? "unreachable" : "Facebook DNS";
    fbLabel.setAttribute("fill", t > 28.8 ? C.red : C.orange);

    const ttl = t < 28.6 ? 1 - 0.15 * seg(t, 22, 28.6) : 0.85 * (1 - seg(t, 28.6, 37.4));
    const tlen = 2 * Math.PI * 34;
    ttlArc.setAttribute("stroke-dasharray", `${tlen * ttl} ${tlen}`);
    ttlArc.setAttribute("stroke", ttl > 0.25 ? C.cyan : ttl > 0 ? C.orange : C.red);

    if (t > 24.6 && t < 28.4) trip(fbLink, t, 24.8, 26.6, C.orange);
    for (const s of [23.0, 26.8, 30.0, 32.4, 34.8]) trip(phoneLink, t, s, s + 1.2, C.cyan);
    for (const s of [38.0, 39.6, 41.2]) trip(phoneLink, t, s, s + 1.2, C.red);

    apps.forEach((a, i) => {
        const down = t > 38.6 + i * 0.9;
        a.r.setAttribute("fill", down ? "#2a1418" : "#0f3a40");
        a.r.setAttribute("stroke", down ? C.red : C.cyan);
        a.label.setAttribute("fill", down ? C.red : C.cyan);
        a.label.setAttribute("text-decoration", down ? "line-through" : "none");
    });
    show(outage, fade(t, 41.0, 43.3, 0.4));
    show(cta, seg(t, 43.5, 44.0));
});
</script>
</body>
</html>
